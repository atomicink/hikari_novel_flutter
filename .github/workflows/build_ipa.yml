name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fix iOS Deployment Target in Podfile
        run: |
          cd ios
          sed -i '' "s/# platform :ios, '.*'/platform :ios, '15.0'/g" Podfile || true
          sed -i '' "s/platform :ios, '.*'/platform :ios, '15.0'/g" Podfile || true
          if ! grep -q "platform :ios" Podfile; then
            echo "platform :ios, '15.0'" | cat - Podfile > temp && mv temp Podfile
          fi
          cd ..

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Release (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q hikari_novel.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-novel-unsigned-ipa
          path: hikari_novel.ipa
          retention-days: 7
